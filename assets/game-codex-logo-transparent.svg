<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">GAME CODEX</title>
  <desc id="desc">Transparent blue gaming codex logo</desc>
  <defs>
    <linearGradient id="book" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2eeaff"/>
      <stop offset="0.34" stop-color="#0788ff"/>
      <stop offset="0.72" stop-color="#174dff"/>
      <stop offset="1" stop-color="#2717bf"/>
    </linearGradient>
    <linearGradient id="code" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1765ff"/>
      <stop offset="0.55" stop-color="#079cff"/>
      <stop offset="1" stop-color="#25e6ff"/>
    </linearGradient>
    <linearGradient id="game" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d8e1ee"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g transform="translate(18 26)" filter="url(#glow)">
    <path d="M26 52 L68 29 L68 224 L26 243 Z" fill="#0836c8" stroke="#28e7ff" stroke-width="5"/>
    <path d="M58 34 L101 20 L101 215 L58 229 Z" fill="#0756e9" stroke="#18cfff" stroke-width="5"/>
    <rect x="88" y="9" width="184" height="218" rx="24" fill="url(#book)" stroke="#38eaff" stroke-width="5"/>
    <path d="M126 10 H176 V75 L151 57 L126 76 Z" fill="#4eeaff"/>
    <path d="M110 230 H273 L251 257 H70 Z" fill="#1ce1ff" stroke="#0a45ef" stroke-width="6"/>
    <path d="M134 109 C145 91 165 84 187 88 C202 91 207 99 220 98 C237 96 253 103 261 119 C268 133 270 177 260 191 C251 205 237 204 228 193 L211 172 H165 L149 193 C140 205 124 206 116 193 C106 177 110 132 118 118 C122 113 127 110 134 109 Z" fill="#06102a" stroke="#29dcff" stroke-width="4"/>
    <g fill="#36e8ff">
      <rect x="143" y="119" width="13" height="39" rx="3"/>
      <rect x="130" y="132" width="39" height="13" rx="3"/>
      <circle cx="225" cy="125" r="8"/>
      <circle cx="244" cy="142" r="8"/>
      <circle cx="225" cy="159" r="8"/>
      <circle cx="206" cy="142" r="8"/>
    </g>
  </g>

  <g font-family="Arial Black, Inter, Segoe UI, sans-serif" font-weight="900" letter-spacing="4">
    <text x="330" y="128" font-size="112" fill="url(#game)" stroke="#ffffff" stroke-opacity=".18" stroke-width="2">GAME</text>
    <text x="322" y="248" font-size="112" fill="url(#code)" stroke="#36eaff" stroke-opacity=".35" stroke-width="2">CODEX</text>
  </g>
</svg>