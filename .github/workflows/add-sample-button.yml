name: Wire built-in sample button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add sample helper script to index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          tag = '  <script src="sample-button.js"></script>\n'
          if tag in text:
              raise SystemExit(0)
          marker = '  <script src="i18n.js"></script>\n'
          if marker not in text:
              raise SystemExit('i18n script marker not found')
          text = text.replace(marker, marker + tag, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit index wiring if needed
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore built-in sample button"
          git push
