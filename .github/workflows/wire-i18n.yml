name: Wire GAME CODEX i18n

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire-i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add i18n script to index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          tag = '  <script src="i18n.js"></script>\n'
          if tag not in text:
              if '</body>' not in text:
                  raise SystemExit('index.html has no closing body tag')
              text = text.replace('</body>', tag + '</body>', 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit wiring if needed
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "i18n wiring already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Wire English language switch into GAME CODEX"
          git push
