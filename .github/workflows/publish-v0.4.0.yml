name: Publish v0.4.0 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.4.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish v0.4.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v0.4.0 >/dev/null 2>&1; then
            echo "v0.4.0 already exists; nothing to do."
            exit 0
          fi

          cat > /tmp/release-notes.md <<'EOF'
          ## GAME CODEX UIアップデート

          ゲーム攻略ライブラリを **GAME CODEX** として再設計し、日常的に使いやすいUIへ更新しました。

          ### 変更点

          - GAME CODEX の新しいブランドロゴを導入しました
          - ロゴ背景を透過化し、ヘッダーとfaviconを統一しました
          - ヘッダーをコンパクト化し、アプリらしい操作密度へ調整しました
          - GitBookを意識したクリーンなタイポグラフィへ変更しました
          - HTML攻略と攻略サイトURLを1つのライブラリで管理できます
          - お気に入り、検索、絞り込み、並び替え、バックアップ機能を利用できます
          - 攻略HTMLのチェック進捗をブラウザ内へ保存する仕組みを改善しました

          ### 利用方法

          GitHub Pages版を開けば、そのままブラウザで利用できます。登録した攻略データは基本的にブラウザ内へ保存されます。

          > 注: 外部攻略サイトは、サイト側のセキュリティ設定によりアプリ内表示できない場合があります。その場合は外部タブで開いてください。
          EOF

          gh release create v0.4.0 \
            --target "$GITHUB_SHA" \
            --title "GAME CODEX v0.4.0 — UI & Brand Refresh" \
            --notes-file /tmp/release-notes.md \
            --latest
