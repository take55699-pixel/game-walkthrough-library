name: One-time security hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Harden imported HTML execution
        run: node scripts/harden-index.mjs
      - name: Remove one-time migration files
        run: |
          rm scripts/harden-index.mjs
          rm .github/workflows/harden-index.yml
      - name: Commit hardened app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/harden-index.mjs .github/workflows/harden-index.yml
          git commit -m "Harden imported HTML execution"
          git push
